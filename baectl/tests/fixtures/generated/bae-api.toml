[server]
addr = "0.0.0.0:9090"

[[agents]]
name = "reference-assistant"
command = "/usr/local/bin/reference-assistant"

[agents.request_schema]
type = "object"
required = ["prompt"]
[agents.request_schema.properties."prompt"]
type = "string"

[[agents.env_template]]
field = "prompt"
env = "AGENT_PROMPT"

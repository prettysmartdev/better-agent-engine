[package]
name = "baectl"
version = "0.1.0"
edition = "2021"
description = "Command-line client for the Better Agent Engine (BAE) admin API"
license = "Apache-2.0"
# baectl ships only inside the BAE Docker image (its version tracks the image
# tag), never as a standalone crates.io release — see aspec/devops/cicd.md.
publish = false

[dependencies]
# CLI parsing — clap v4 derive macros give the subcommand tree, `--help`
# generation, and positional/flag validation used across the command surface.
clap = { version = "4", features = ["derive"] }
# HTTP transport to the BAE admin API (`/admin/v1`). `default-features = false`
# with `rustls` keeps the TLS stack pure-Rust (no OpenSSL) — LOAD-BEARING
# for the static-binary requirement: an OpenSSL/native-tls dependency (direct
# or transitive) would break static linking under the `x86_64-unknown-linux-musl`
# target this binary ships as. `json` gives typed request/response bodies and
# `blocking` keeps the CLI a straight-line synchronous program (no async
# runtime to manage). Mirrors the `rustls`-only convention in
# `server/Cargo.toml` and `client-rust/Cargo.toml`.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "blocking"] }
# API (de)serialization — mirrors the server's snake_case admin wire contract.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error enum for the CLI's error type and its exit-code mapping.
thiserror = "2"
# Local admin-key generation for `baectl auth create key` ONLY (every other
# command is a pure HTTP client). SHA-256 + SysRng mirror `server/Cargo.toml`'s
# choices exactly so the hash baectl writes is byte-for-byte the same digest
# the server computes — a bare unsalted digest, not a self-describing hash.
sha2 = "0.11"
rand = "0.10"
# `baectl setup` reads back an existing `bae-config.toml`/`.env` on the
# idempotent Edit path (and to summarize a saved configuration). The generated
# `bae-config.toml` is *written* by hand-building the string field-by-field (see
# `setup.rs`'s module doc) — `toml` is used only for reading. Pinned to the same
# `1.1` line the `server` crate uses so the workspace carries a single TOML
# implementation (pure-Rust; preserves the static-musl binary requirement).
toml = "1.1"

[dev-dependencies]
# `setup` hand-builds TOML to keep the shipping CLI independent of the server.
# Its tests intentionally parse generated files with the server's actual schema
# so a schema change cannot silently make wizard output invalid.
baesrv = { path = "../server" }
